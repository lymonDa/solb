<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 340 80" width="340" height="80" fill="none">

    <path d="M30 4 V0 M30 60 V56 M4 30 H0 M60 30 H56 M11.6 11.6 L8.8 8.8 M48.4 48.4 L51.2 51.2 M11.6 48.4 L8.8 51.2 M48.4 11.6 L51.2 8.8" stroke="#F2BE3D" stroke-width="2.5" stroke-linecap="round"/>

    <path d="M8 52 L52 8" stroke="#F2BE3D" stroke-width="4.5" stroke-linecap="square"/>

  <!-- Arabic Wordmark: صلب -->

  <text x="174" y="46" font-family="'IBM Plex Sans', 'Inter', -apple-system, sans-serif" font-weight="900" font-size="28" fill="#F5F6F4" letter-spacing="2.5">SOLB</text>
  <!-- Technical sub-descriptor -->
  <text x="83" y="66" font-family="'IBM Plex Sans Arabic', 'Segoe UI', sans-serif" font-weight="600" font-size="10.5" fill="#F2BE3D" letter-spacing="0.5">قص وتخريم الخرسانة بالرياض</text>
</svg>
